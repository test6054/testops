<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    教学质量中心 · 站点默认 Logo（业务推导）
    语义：三域闭环 — 阅卷 / 质评 / 档案 等权共构，环形闭合表示治理闭环
    禁止：学士帽、书本、古典建筑、单一阅卷对勾主宰
  -->
  <defs>
    <!-- 阅卷域：品牌主色 -->
    <linearGradient id="tqMark" x1="20" y1="24" x2="108" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4096ff"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <!-- 质评域：OBE / 达成 -->
    <linearGradient id="tqQuality" x1="20" y1="100" x2="110" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#597ef7"/>
      <stop offset="1" stop-color="#2f54eb"/>
    </linearGradient>
    <!-- 档案域：材料 / 证据 -->
    <linearGradient id="tqPortfolio" x1="96" y1="20" x2="32" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36cfc9"/>
      <stop offset="1" stop-color="#08979c"/>
    </linearGradient>
  </defs>
  <!--
    三等分甜甜圈（约 112° 扇区 + 间隙），120° 旋转对称。
    中心留白：三域汇于同一教学质量治理，但不堆中枢建筑标。
  -->
  <!-- 阅卷：上扇 -->
  <path
    fill="url(#tqMark)"
    d="M64 14
       A50 50 0 0 1 107.301 89.064
       L91.381 80.038
       A32 32 0 0 0 64 32
       Z"
  />
  <!-- 档案：右下扇 -->
  <path
    fill="url(#tqPortfolio)"
    d="M107.301 89.064
       A50 50 0 0 1 20.699 89.064
       L36.619 80.038
       A32 32 0 0 0 91.381 80.038
       Z"
  />
  <!-- 质评：左下扇 -->
  <path
    fill="url(#tqQuality)"
    d="M20.699 89.064
       A50 50 0 0 1 64 14
       L64 32
       A32 32 0 0 0 36.619 80.038
       Z"
  />
  <!-- 间隙修正：用细白缝强调「三域可分」——在 32px 仍可读为三段 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="64" x2="64" y2="14"/>
    <line x1="64" y1="64" x2="107.301" y2="89.064"/>
    <line x1="64" y1="64" x2="20.699" y2="89.064"/>
  </g>
  <!-- 中心实体：治理汇合点（短箭头顶表持续改进，体积极小以免喧宾） -->
  <circle cx="64" cy="64" r="15" fill="#1677ff"/>
  <path
    d="M64 56 L70 64 H66.5 V72 H61.5 V64 H58 Z"
    fill="#ffffff"
  />
</svg>
