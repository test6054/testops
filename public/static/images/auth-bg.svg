<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <!-- Background base -->
  <rect width="1200" height="900" fill="#1e3a5f"/>
  
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="800" x2="1200" y2="800"/>
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
  </g>
  
  <!-- Large decorative circles -->
  <circle cx="200" cy="150" r="280" fill="url(#g1)" opacity="0.15"/>
  <circle cx="900" cy="700" r="350" fill="url(#g2)" opacity="0.12"/>
  <circle cx="700" cy="200" r="180" fill="url(#g3)" opacity="0.08"/>
  
  <!-- Abstract nodes (representing data/network) -->
  <g opacity="0.2" fill="#fff">
    <circle cx="300" cy="300" r="4"/>
    <circle cx="500" cy="200" r="3"/>
    <circle cx="700" cy="350" r="5"/>
    <circle cx="400" cy="500" r="3"/>
    <circle cx="600" cy="600" r="4"/>
    <circle cx="800" cy="450" r="3"/>
    <circle cx="250" cy="650" r="4"/>
    <circle cx="900" cy="250" r="3"/>
    <circle cx="150" cy="400" r="3"/>
    <circle cx="1000" cy="550" r="4"/>
    <circle cx="550" cy="400" r="6"/>
    <circle cx="350" cy="700" r="3"/>
    <circle cx="750" cy="550" r="4"/>
    <circle cx="450" cy="150" r="3"/>
    <circle cx="850" cy="150" r="4"/>
  </g>
  
  <!-- Connection lines between nodes -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="300" y1="300" x2="500" y2="200"/>
    <line x1="500" y1="200" x2="700" y2="350"/>
    <line x1="700" y1="350" x2="800" y2="450"/>
    <line x1="400" y1="500" x2="600" y2="600"/>
    <line x1="550" y1="400" x2="700" y2="350"/>
    <line x1="550" y1="400" x2="400" y2="500"/>
    <line x1="600" y1="600" x2="750" y2="550"/>
    <line x1="250" y1="650" x2="350" y2="700"/>
    <line x1="300" y1="300" x2="150" y2="400"/>
    <line x1="800" y1="450" x2="1000" y2="550"/>
    <line x1="500" y1="200" x2="450" y2="150"/>
    <line x1="700" y1="350" x2="900" y2="250"/>
    <line x1="900" y1="250" x2="850" y2="150"/>
  </g>

  <!-- Dashboard mockup card 1 -->
  <g transform="translate(150, 280)">
    <rect width="320" height="200" rx="12" fill="#fff" opacity="0.08"/>
    <rect x="20" y="20" width="120" height="12" rx="6" fill="#fff" opacity="0.15"/>
    <rect x="20" y="44" width="80" height="8" rx="4" fill="#fff" opacity="0.08"/>
    <rect x="20" y="70" width="280" height="60" rx="8" fill="#fff" opacity="0.06"/>
    <rect x="20" y="145" width="60" height="28" rx="6" fill="#3b82f6" opacity="0.3"/>
    <rect x="90" y="145" width="60" height="28" rx="6" fill="#10b981" opacity="0.2"/>
    <rect x="160" y="145" width="60" height="28" rx="6" fill="#f59e0b" opacity="0.2"/>
    <!-- Bar chart inside -->
    <rect x="30" y="110" width="18" height="14" rx="2" fill="#3b82f6" opacity="0.4"/>
    <rect x="56" y="95" width="18" height="29" rx="2" fill="#3b82f6" opacity="0.5"/>
    <rect x="82" y="100" width="18" height="24" rx="2" fill="#3b82f6" opacity="0.35"/>
    <rect x="108" y="85" width="18" height="39" rx="2" fill="#3b82f6" opacity="0.6"/>
    <rect x="134" y="105" width="18" height="19" rx="2" fill="#3b82f6" opacity="0.3"/>
    <rect x="160" y="90" width="18" height="34" rx="2" fill="#3b82f6" opacity="0.45"/>
  </g>

  <!-- Dashboard mockup card 2 -->
  <g transform="translate(520, 380)">
    <rect width="280" height="180" rx="12" fill="#fff" opacity="0.07"/>
    <rect x="20" y="20" width="100" height="12" rx="6" fill="#fff" opacity="0.12"/>
    <rect x="20" y="44" width="60" height="8" rx="4" fill="#fff" opacity="0.07"/>
    <!-- Donut chart -->
    <circle cx="140" cy="110" r="45" stroke="#3b82f6" stroke-width="10" fill="none" opacity="0.3" stroke-dasharray="180 100"/>
    <circle cx="140" cy="110" r="45" stroke="#10b981" stroke-width="10" fill="none" opacity="0.25" stroke-dasharray="70 210" stroke-dashoffset="-180"/>
    <circle cx="140" cy="110" r="45" stroke="#f59e0b" stroke-width="10" fill="none" opacity="0.2" stroke-dasharray="30 250" stroke-dashoffset="-250"/>
    <!-- Legend -->
    <rect x="20" y="80" width="8" height="8" rx="2" fill="#3b82f6" opacity="0.5"/>
    <rect x="34" y="80" width="40" height="8" rx="3" fill="#fff" opacity="0.1"/>
    <rect x="20" y="100" width="8" height="8" rx="2" fill="#10b981" opacity="0.4"/>
    <rect x="34" y="100" width="50" height="8" rx="3" fill="#fff" opacity="0.1"/>
    <rect x="20" y="120" width="8" height="8" rx="2" fill="#f59e0b" opacity="0.35"/>
    <rect x="34" y="120" width="35" height="8" rx="3" fill="#fff" opacity="0.1"/>
  </g>

  <!-- Small floating card 3 -->
  <g transform="translate(580, 180)">
    <rect width="200" height="100" rx="10" fill="#fff" opacity="0.06"/>
    <rect x="16" y="16" width="80" height="10" rx="5" fill="#fff" opacity="0.12"/>
    <rect x="16" y="36" width="168" height="6" rx="3" fill="#fff" opacity="0.06"/>
    <rect x="16" y="50" width="130" height="6" rx="3" fill="#fff" opacity="0.05"/>
    <rect x="16" y="70" width="50" height="16" rx="4" fill="#3b82f6" opacity="0.25"/>
  </g>

  <!-- Gradients -->
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </radialGradient>
  </defs>
</svg>
