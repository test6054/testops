<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link href="/mark/favicon.ico" rel="shortcut icon" />
  <meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" name="viewport" />

  <title>教学质量中心 | 阅卷·质评·档案</title>
  <meta name="description" content="教学质量中心面向高校提供考试阅卷、OBE 质量评价与教师档案治理，覆盖扫描录入、智能识别、批阅复核、成绩发布与达成度分析等完整链路。" />
  <meta name="robots" content="noindex, nofollow" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei';
      background-color: #f5f7fd;
      color: #4E5969;
    }
    #app {
      width: 100vw;
      height: 100vh;
      overflow: auto;
    }
    .init-box {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
    }
    .init-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(31, 90, 154, 0.2);
      border-top-color: #2B67FF;
      border-radius: 50%;
      animation: init-spin 0.9s linear infinite;
    }
    .init-text {
      font-size: 13px;
      color: #94a3b8;
    }
    @keyframes init-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="app">
    <section class="init-box">
      <div class="init-spinner"></div>
      <div class="init-text">教学质量中心加载中...</div>
    </section>
  </div>

  <script src="/src/main.ts" type="module"></script>
</body>
</html>
